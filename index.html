<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATV & Buggy Assistant</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- CSS Modules -->
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/layout.css">
</head>
<body>
    <div class="app-container">
        
        <!-- Mobile Overlay -->
        <div id="sidebar-overlay" class="sidebar-overlay"></div>

        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar__header">
                <div class="sidebar__logo">
                    <img src="assets/images.jpg" alt="A&B Logo" width="32" height="32" style="border-radius: 50%; object-fit: cover;">
                    <span>ATV & Buggy</span>
                </div>
                <!-- Close/Toggle Sidebar Button (Desktop) -->
                <button id="sidebar-close-btn" class="sidebar-toggle-btn" title="Close sidebar">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line></svg>
                </button>
            </div>
            
            <div class="sidebar__actions">
                <button class="btn btn--primary btn--full" id="new-chat-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    New Chat
                </button>
            </div>
            
            <!-- Chat History Section -->
            <div class="sidebar__history">
                <h3 class="sidebar__history-title">Recent Chats</h3>
                <div class="sidebar__history-list" id="chat-history-list">
                    <!-- History items will be injected here via JS -->
                </div>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="chat-main">
            <!-- Header for mobile / contextual info -->
            <header class="chat-header">
                <div style="display: flex; align-items: center; gap: 12px;">
                    <button id="sidebar-open-btn" class="sidebar-toggle-btn hidden" title="Open sidebar">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line></svg>
                    </button>
                    <button id="mobile-menu-btn" class="mobile-menu-btn" aria-label="Open menu">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                    </button>
                </div>
                <h2>Adventure Guide</h2>
                <div style="width: 24px;"></div> <!-- spacer to center title -->
            </header>

            <!-- Scrollable Messages -->
            <div class="chat-messages-container">
                <div id="chat-messages" class="chat-messages" aria-live="polite">
                    <!-- Messages injected here via JS -->
                </div>
            </div>

            <!-- Input Area -->
            <div class="chat-input-wrapper">
                <form id="chat-form" class="chat-form">
                    <input type="text" id="chat-input" class="chat-input" placeholder="Ask about our tours, buggies, or safety..." autocomplete="off" required>
                    <button type="submit" class="chat-submit-btn" aria-label="Send message">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                    </button>
                </form>
                <div class="chat-footer-note">
                    ATVBot can make mistakes. Please verify important booking details.
                </div>
            </div>
        </main>

    </div>

    <!-- JS Modules -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
